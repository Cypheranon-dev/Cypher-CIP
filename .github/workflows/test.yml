name: test

on:
  push:
  pull_request:

jobs:
  protocol-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/test_protocol_logic.py
      - run: python3 sim/emission.py
